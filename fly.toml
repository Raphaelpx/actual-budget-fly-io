# fly.toml app configuration file generated for orcamento-actual-raphaelpx on 2026-11-06T18:01:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orcamento-actual-raphaelpx'
primary_region = 'gru'

[build]
  image = 'actualbudget/actual-server:latest'

[[mounts]]
  source = 'actual_data'
  destination = '/data'

[http_service]
  internal_port = 5006
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
